<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cinematics Library · VER Intelligence Hub</title>
<style>
:root {
  --navy:#0F1E3C; --navy2:#1E3A5F; --navy3:#EFF6FF;
  --teal:#0D9488; --teal2:#0F766E; --teal3:#F0FDF9;
  --green:#059669; --green2:#065F46; --green3:#D1FAE5;
  --amber:#D97706; --amber2:#78350F; --amber3:#FEF3C7;
  --red:#DC2626; --red2:#7F1D1D; --red3:#FEE2E2;
  --purple:#7C3AED; --purple3:#F5F3FF;
  --blue:#2563EB; --blue3:#EFF6FF;
  --ink:#111827; --ink2:#1F2937; --ink3:#374151; --ink4:#6B7280;
  --gray:#F9FAFB; --gray2:#F3F4F6; --gray3:#E5E7EB;
  --border:#E5E7EB; --border2:#D1D5DB; --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--gray);color:var(--ink2);font-size:9pt;}
.vp-wrap{display:flex;min-height:100vh;}
.vp-side{width:220px;background:var(--navy);flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:100;}
.vp-main{flex:1;padding:24px 28px;overflow-x:hidden;}
.vp-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.vp-logo-title{font-size:10.5pt;font-weight:800;color:#fff;line-height:1.2;}
.vp-logo-sub{font-size:8pt;color:rgba(255,255,255,0.65);margin-top:2px;letter-spacing:0.05em;text-transform:uppercase;}
.vp-nav{padding:12px 0;}
.vp-nav-section{font-size:8pt;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.60);padding:10px 18px 4px;}
.vp-nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;font-size:8.5pt;font-weight:600;color:rgba(255,255,255,0.85);text-decoration:none;transition:all 0.15s;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.vp-nav-item:hover,.vp-nav-item.active{background:rgba(255,255,255,0.10);color:#fff;}
.vp-nav-item.active{border-left:3px solid var(--teal);}
.vp-nav-icon{font-size:12pt;flex-shrink:0;}
.vp-nav-divider{height:1px;background:rgba(255,255,255,0.08);margin:8px 0;}
.vp-side-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);font-size:8pt;color:rgba(255,255,255,0.55);margin-top:auto;}
.vp-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.vp-page-title{font-size:15pt;font-weight:900;color:var(--navy);}
.vp-page-sub{font-size:9pt;color:var(--ink3);margin-top:2px;}

/* ── Type tabs ── */
.type-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.type-tab{font-size:8pt;font-weight:700;padding:5px 14px;border-radius:20px;border:1.5px solid var(--border2);background:#fff;color:var(--ink3);cursor:pointer;transition:all 0.15s;}
.type-tab:hover{border-color:var(--teal);color:var(--teal);}
.type-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}

/* ── Filter bar ── */
.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
.fsel{font-size:8pt;padding:5px 10px;border:1px solid var(--border2);border-radius:6px;background:#fff;color:var(--ink2);cursor:pointer;}
.fsearch{font-size:8pt;padding:5px 12px;border:1px solid var(--border2);border-radius:6px;background:#fff;color:var(--ink2);width:200px;}
.f-count{font-size:8pt;color:var(--ink4);margin-left:auto;}

/* ── Section headers ── */
.section-header{display:flex;align-items:center;gap:10px;margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--border);}
.section-header:first-child{margin-top:0;}
.section-title{font-size:10.5pt;font-weight:900;color:var(--navy);}
.section-count{font-size:8.5pt;color:var(--ink4);font-weight:600;}
.section-icon{font-size:13pt;}

/* ── Cinematic grid ── */
.cin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:8px;}
.qbr-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:box-shadow 0.15s,transform 0.15s;cursor:pointer;text-decoration:none;display:block;}
.qbr-card:hover{box-shadow:0 6px 24px rgba(0,0,0,0.09);transform:translateY(-2px);}
.qbr-card-banner{height:6px;}
.qbr-card-body{padding:16px 18px;}
.qbr-vendor{font-size:11pt;font-weight:900;color:var(--navy);margin-bottom:4px;}
.qbr-meta{font-size:8.5pt;color:var(--ink4);margin-bottom:10px;}
.qbr-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.qbr-tag{font-size:8pt;padding:2px 8px;border-radius:8px;font-weight:700;}
.qbr-tag.quarter{background:var(--navy3);color:var(--navy2);}
.qbr-tag.cat{background:var(--teal3);color:var(--teal2);}
.qbr-tag.status-complete{background:var(--green3);color:var(--green2);}
.qbr-tag.status-upcoming{background:var(--amber3);color:var(--amber2);}
.qbr-highlights{font-size:8pt;color:var(--ink3);line-height:1.55;border-top:1px solid var(--gray2);padding-top:10px;}
.qbr-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--gray);border-top:1px solid var(--border);}
.qbr-footer-lbl{font-size:8.5pt;color:var(--ink4);}
.qbr-cta{font-size:8.5pt;font-weight:700;color:var(--teal);display:flex;align-items:center;gap:4px;}

/* ── Empty state ── */
.empty{text-align:center;padding:60px 20px;color:var(--ink4);}
.empty-icon{font-size:36pt;margin-bottom:12px;}
.empty-title{font-size:11pt;font-weight:800;color:var(--ink3);margin-bottom:6px;}
</style>
</head>
<body>
<div class="vp-wrap">

  <!-- Sidebar -->
  <div class="vp-side">
    <div class="vp-logo">
      <div class="vp-logo-title">VER Intelligence<br>Hub</div>
      <div class="vp-logo-sub">DET · FY27</div>
    </div>
    <nav class="vp-nav">
      <div class="vp-nav-section">Resources</div>
      <a href="page_cqbr.html" class="vp-nav-item active"><span class="vp-nav-icon">&#127909;</span>Cinematics Library</a>
      <a href="page_digest.html" class="vp-nav-item"><span class="vp-nav-icon">&#128240;</span>Monthly Digest</a>
      <a href="page_vision_series.html" class="vp-nav-item"><span class="vp-nav-icon">&#127909;</span>Vision Series</a>
      <a href="page_roadmap.html" class="vp-nav-item"><span class="vp-nav-icon">&#128506;</span>Roadmap</a>
      <a href="page_team.html" class="vp-nav-item"><span class="vp-nav-icon">&#128105;</span>Team & Charter</a>
      <a href="page_guide.html" class="vp-nav-item"><span class="vp-nav-icon">&#128216;</span>VER Guide</a>
      <div class="vp-nav-divider"></div>
      <a href="index.html" class="vp-nav-item"><span class="vp-nav-icon">&#8617;</span>Back to Hub</a>
    </nav>
    <div class="vp-side-footer">VER Intelligence Hub<br>Salesforce DET · FY27</div>
  </div>

  <!-- Main -->
  <div class="vp-main">
    <div class="vp-topbar">
      <div>
        <div class="vp-page-title">&#127909; Cinematics Library</div>
        <div class="vp-page-sub">All cinematic presentations — QBRs, MBRs, Training &amp; more</div>
      </div>
      <button type="button" onclick="openCinematicsHelp()" aria-label="How to use the Cinematics Library"
        style="padding:5px 14px;border-radius:6px;background:var(--navy);border:1px solid var(--navy2);color:#fff;font-size:8pt;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap;">&#63; How to Use</button>
    </div>

    <!-- Type tabs -->
    <div class="type-tabs" id="type-tabs">
      <button type="button" class="type-tab active" data-type="">All</button>
      <button type="button" class="type-tab" data-type="cqbr">&#127909; Cinematic QBR</button>
      <button type="button" class="type-tab" data-type="mbr">&#128200; Monthly Business Review</button>
      <button type="button" class="type-tab" data-type="training">&#127891; Peer-to-Peer Training</button>
      <button type="button" class="type-tab" data-type="other">&#10024; Other</button>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <select class="fsel" id="f-vendor" onchange="render()">
        <option value="">All Vendors / Subjects</option>
      </select>
      <select class="fsel" id="f-quarter" onchange="render()">
        <option value="">All Quarters</option>
        <option>FY27 Q1</option><option>FY27 Q2</option><option>FY27 Q3</option><option>FY27 Q4</option>
        <option>FY26 Q4</option><option>FY26 Q3</option><option>FY26 Q2</option><option>FY26 Q1</option>
      </select>
      <select class="fsel" id="f-status" onchange="render()">
        <option value="">All Statuses</option>
        <option>Complete</option><option>Upcoming</option>
      </select>
      <span class="f-count" id="f-count"></span>
    </div>

    <!-- Content area -->
    <div id="content-area"></div>
  </div>
</div>

<script>
// ── Type definitions ──
var TYPE_DEFS = [
  { id:'cqbr',     label:'Cinematic QBR',            icon:'&#127909;', names:['Cinematic QBR','Collaborative Quarterly Business Review','CQBR'] },
  { id:'mbr',      label:'Monthly Business Review',   icon:'&#128200;', names:['Monthly Business Review','MBR'] },
  { id:'training', label:'Peer-to-Peer Training',     icon:'&#127891;', names:['Training / Enablement','Training','Enablement','Peer-to-Peer Training'] },
  { id:'other',    label:'Other',                     icon:'&#10024;',  names:[] }
];

function classifyEntry(q) {
  var cat = (q.typeId || q.category || '').toLowerCase();
  var name = (q.typeName || q.category || '').toLowerCase();
  if (cat === 'cqbr' || name.indexOf('qbr') >= 0 || name.indexOf('quarterly') >= 0) return 'cqbr';
  if (cat === 'mbr' || name.indexOf('monthly business') >= 0 || name.indexOf('mbr') >= 0) return 'mbr';
  if (cat === 'training' || name.indexOf('training') >= 0 || name.indexOf('enablement') >= 0) return 'training';
  return 'other';
}

// ── One-time seed ──
(function() {
  try {
    var lib = JSON.parse(localStorage.getItem('ver_cqbr_library') || '[]');
    var SEEDS = [
      {
        vendor: 'Cognizant',
        quarter: 'FY26 Q4',
        date: 'June 2026',
        category: 'Cinematic QBR',
        typeId: 'cqbr',
        status: 'Complete',
        color: '#0D9488',
        highlights: 'Key themes: Headcount optimization, rate normalization across AMER pillars, and AI practice capability review. Actions: 3 open governance items, 2 rate renegotiations in progress.',
        href: 'Cognizant_QBR_FY26Q4_Cinematic_v2.html',
        generated: true,
        generatedAt: '2026-06-01T00:00:00.000Z'
      },
      {
        vendor: 'VER Team',
        quarter: 'Q1 FY27',
        date: 'July 2026',
        category: 'Peer-to-Peer Training',
        typeId: 'training',
        status: 'Complete',
        color: '#7C3AED',
        highlights: 'Building the Cinematic CQBR — peer-led walkthrough of the VER cinematic generator: form design, parse logic, scene architecture, and live generation demo. Presented by Casey Luciana Candelaria-Logan.',
        href: 'test/VER_Peer_Learning_Presentation.html',
        generated: false
      }
    ];
    var changed = false;
    SEEDS.forEach(function(seed) {
      var key = seed.vendor + '||' + seed.quarter;
      var idx = lib.findIndex(function(r){ return (r.vendor+'||'+r.quarter) === key; });
      if (idx < 0) { lib.push(seed); changed = true; }
      else {
        // Always sync category/typeId so stale entries get corrected
        var r = lib[idx];
        if (r.category !== seed.category || r.typeId !== seed.typeId) {
          r.category = seed.category; r.typeId = seed.typeId; changed = true;
        }
      }
    });
    if (changed) localStorage.setItem('ver_cqbr_library', JSON.stringify(lib));
  } catch(e) {}
})();

function loadQBRS() {
  try { return JSON.parse(localStorage.getItem('ver_cqbr_library') || '[]'); } catch(e) { return []; }
}

var QBRS = loadQBRS();
var activeType = '';

// ── Tab wiring ──
document.getElementById('type-tabs').addEventListener('click', function(e) {
  var btn = e.target.closest('.type-tab');
  if (!btn) return;
  activeType = btn.dataset.type;
  document.querySelectorAll('.type-tab').forEach(function(b){ b.classList.toggle('active', b === btn); });
  render();
});

function buildVendorFilter() {
  var sel = document.getElementById('f-vendor');
  var kept = sel.options[0];
  while (sel.options.length > 1) sel.remove(1);
  var vendors = [...new Set(QBRS.map(function(q){ return q.vendor; }))].sort();
  vendors.forEach(function(v){
    var o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}

function openGeneratedCinematic(htmlKey) {
  var html = '';
  try { html = localStorage.getItem(htmlKey) || ''; } catch(e) {}
  if (!html) { alert('Cinematic not found. It may have been cleared from storage.'); return; }
  var blob = new Blob([html], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function _el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
function _txt(tag, cls, text) { var e = _el(tag, cls); e.textContent = text || ''; return e; }

function buildCard(q) {
  var status = q.status || 'Complete';
  var isBlob = !!(q.htmlKey && (!q.href || q.href === '#'));
  var card = _el('a', 'qbr-card');
  if (isBlob) {
    card.href = '#';
    card.addEventListener('click', (function(k){ return function(e){ e.preventDefault(); openGeneratedCinematic(k); }; })(q.htmlKey));
  } else {
    card.href = q.href || '#';
  }

  var banner = _el('div', 'qbr-card-banner');
  banner.style.background = q.color || '#0D9488';
  card.appendChild(banner);

  var body = _el('div', 'qbr-card-body');
  body.appendChild(_txt('div', 'qbr-vendor', q.vendor || ''));

  var typeLabel = (q.typeName || q.category || 'Cinematic');
  var meta = _el('div', 'qbr-meta');
  meta.textContent = (q.date || '') + ' · ' + typeLabel;
  body.appendChild(meta);

  var tags = _el('div', 'qbr-tags');
  if (q.quarter) tags.appendChild(_txt('span', 'qbr-tag quarter', q.quarter));
  tags.appendChild(_txt('span', 'qbr-tag status-' + status.toLowerCase(), status));
  if (q.generated) {
    var gb = _txt('span', 'qbr-tag', '⚡ VER Generated');
    gb.style.background = '#EFF6FF'; gb.style.color = '#1D4ED8'; gb.style.marginLeft = 'auto';
    tags.appendChild(gb);
  }
  body.appendChild(tags);

  var hl = _el('div', 'qbr-highlights');
  hl.textContent = q.highlights ? q.highlights.replace(/<[^>]+>/g, '') : '';
  body.appendChild(hl);
  card.appendChild(body);

  var footer = _el('div', 'qbr-footer');
  footer.appendChild(_txt('span', 'qbr-footer-lbl', 'VER Intelligence Hub'));
  footer.appendChild(_txt('span', 'qbr-cta', 'View Cinematic →'));
  card.appendChild(footer);
  return card;
}

function render() {
  var vendor  = document.getElementById('f-vendor').value;
  var quarter = document.getElementById('f-quarter').value;
  var status  = document.getElementById('f-status').value;

  var filtered = QBRS.filter(function(q){
    if (vendor  && q.vendor !== vendor) return false;
    if (quarter && q.quarter !== quarter) return false;
    if (status  && (q.status || 'Complete') !== status) return false;
    if (activeType) {
      var t = classifyEntry(q);
      if (activeType === 'other') {
        if (t !== 'other') return false;
      } else {
        if (t !== activeType) return false;
      }
    }
    return true;
  });

  document.getElementById('f-count').textContent = filtered.length + ' of ' + QBRS.length + ' cinematics';

  var area = document.getElementById('content-area');
  area.innerHTML = '';

  if (!filtered.length) {
    var emptyDiv = _el('div', 'empty');
    var iconDiv = _el('div', 'empty-icon');
    iconDiv.textContent = QBRS.length === 0 ? '🎬' : '🔍';
    emptyDiv.appendChild(iconDiv);
    emptyDiv.appendChild(_txt('div', 'empty-title', QBRS.length === 0 ? 'No cinematics yet' : 'No cinematics match your filters'));
    if (QBRS.length === 0) {
      var hint = _el('div');
      hint.style.cssText = 'font-size:9pt;color:var(--ink4);margin-top:6px;';
      hint.textContent = 'Generate your first cinematic from the Team Portal to populate this library.';
      emptyDiv.appendChild(hint);
    }
    area.appendChild(emptyDiv);
    return;
  }

  if (activeType) {
    // Single type selected — flat grid, no section headers
    var grid = _el('div', 'cin-grid');
    filtered.sort(function(a,b){ return (a.vendor||'').localeCompare(b.vendor||''); })
            .forEach(function(q){ grid.appendChild(buildCard(q)); });
    area.appendChild(grid);
  } else {
    // All types — grouped sections
    var SECTIONS = [
      { typeId:'cqbr',     label:'Cinematic QBR',           icon:'&#127909;' },
      { typeId:'mbr',      label:'Monthly Business Review',  icon:'&#128200;' },
      { typeId:'training', label:'Peer-to-Peer Training',    icon:'&#127891;' },
      { typeId:'other',    label:'Other Cinematics',         icon:'&#10024;' }
    ];
    SECTIONS.forEach(function(sec) {
      var items = filtered.filter(function(q){ return classifyEntry(q) === sec.typeId; })
                          .sort(function(a,b){ return (a.vendor||'').localeCompare(b.vendor||''); });
      if (!items.length) return;
      var hdr = _el('div', 'section-header');
      var iconEl = _el('span', 'section-icon');
      iconEl.innerHTML = sec.icon;
      hdr.appendChild(iconEl);
      hdr.appendChild(_txt('span', 'section-title', sec.label));
      hdr.appendChild(_txt('span', 'section-count', '(' + items.length + ')'));
      area.appendChild(hdr);
      var grid = _el('div', 'cin-grid');
      items.forEach(function(q){ grid.appendChild(buildCard(q)); });
      area.appendChild(grid);
    });
  }
}

buildVendorFilter();
render();

window.addEventListener('storage', function(e) {
  if (e.key === 'ver_cqbr_library') {
    QBRS = loadQBRS();
    buildVendorFilter();
    render();
  }
});
</script>
<script src="assets/help-modal.js"></script>
<script>
function openCinematicsHelp(){
  HelpModal.open({
    title: 'Cinematics Library',
    what: 'The Cinematics Library is the <strong>searchable archive of all VER cinematic presentations</strong> — QBRs, Monthly Business Reviews, Training sessions, and more. Every vendor, every quarter, with full performance data, VER commentary, and action outcomes.',
    steps: [
      '<strong>Use the type tabs</strong> to filter by presentation type — Cinematic QBR, Monthly Business Review, Peer-to-Peer Training, or Other.',
      '<strong>Search by vendor / subject</strong> to pull up all cinematics for that supplier or topic.',
      '<strong>Filter by quarter or status</strong> to find cinematics relevant to a current decision or governance review.',
      '<strong>Click any card</strong> to open the full cinematic — includes scorecard, action items, VER commentary, and outcome tracking.',
      '<strong>Export cinematics</strong> for escalation packages, renewal preparation, or SteerCo materials.'
    ],
    tips: [
      { icon: '&#x1F3AC;', title: 'Trend beats snapshot', body: 'One bad quarter is noise. Three consecutive declining quarters is a pattern. Always look at the trend line, not just the latest.' },
      { icon: '&#x26A0;', title: 'Action items are binding', body: 'Action items committed to in a cinematic are tracked to completion. Open items from prior quarters are escalated automatically.' },
      { icon: '&#x1F50D;', title: 'Search before renewal', body: 'Always pull the cinematic history before entering a renewal conversation. Performance history is your strongest negotiation evidence.' },
      { icon: '&#x26A1;', title: 'VER Generated', body: 'Cards marked ⚡ VER Generated were created in the Cinematic Generator and live in your browser storage. They open instantly.' }
    ],
    footNote: 'FY27 &middot; Salesforce DET &middot; Confidential'
  });
}
</script>
</body>
